[package]
name = "GitHub-Repository-Sync"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11"}
tokio = { version = "1.28", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"
chrono = "0.4.38"
log = "0.4.22"
simplelog = "0.12.2"
